appId: com.mailbridge.app
productName: MailBridge
directories:
  output: dist
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${name}-${version}-setup.${ext}
  icon: icon.ico
  # Windows-specific executable options for crash resilience
  executableName: MailBridge
  # Enable app sandbox for Windows (limited protection, but helps with isolation)
  signAndEditExecutable: false
  legalTrademarks: MailBridge
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  unicode: true
extraResources:
  - from: resources
    to: '.'
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
  - node_modules/sql.js/dist/sql-wasm.wasm
  - '**/notification-preload.js'
